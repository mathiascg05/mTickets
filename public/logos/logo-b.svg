<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <!-- Ticket silhouette with integrated music note -->
  <path d="
    M 8 4 H 68 Q 76 4, 76 12
    V 24 A 7 7 0 0 1 76 38
    V 42 A 7 7 0 0 1 76 56
    V 68 Q 76 76, 68 76
    H 8 Q 0 76, 0 68
    V 56 A 7 7 0 0 0 0 42
    V 38 A 7 7 0 0 0 0 24
    V 12 Q 0 4, 8 4 Z
  " fill="#1a2b4a"/>

  <!-- Music note inside ticket -->
  <!-- Note head -->
  <ellipse cx="30" cy="52" rx="8" ry="5.5" fill="white" transform="rotate(-20, 30, 52)"/>
  <!-- Note stem -->
  <rect x="36.5" y="20" width="2.5" height="33" rx="1" fill="white"/>
  <!-- Note flag -->
  <path d="M 39 20 Q 50 24, 46 35 Q 48 28, 39 26 Z" fill="white"/>

  <!-- "ma" bold text -->
  <text x="88" y="55" font-family="'Geist Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="800" fill="white" text-anchor="start" letter-spacing="-1">ma</text>
  <!-- "Tickets" lighter text -->
  <text x="148" y="55" font-family="'Geist Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="300" fill="white" text-anchor="start" opacity="0.6" letter-spacing="-1">Tickets</text>
</svg>
